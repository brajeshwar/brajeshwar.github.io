# Jekyll - Build and Deploy to Github Pages
# Pagefind, https://pagefind.app, powers the Search
# Updated: Jul 27, 2026
#
# ACTION VERSIONS — bumped 2026-07-27 to clear a GitHub deprecation warning:
# checkout@v4, configure-pages@v5, setup-node@v4, upload-artifact@v4 (pulled in
# by upload-pages-artifact@v3) and deploy-pages@v4 all target Node 20, which the
# runners were force-running on Node 24. Builds were green, but the forcing is
# temporary. Each was moved to the latest major, confirmed to declare
# `using: node24` in its own action.yml rather than assumed.
#
# Checked before bumping, because a major is a major:
#   - configure-pages@v6 still exposes outputs.base_path (used below)
#   - deploy-pages@v5 still exposes outputs.page_url (used by the environment)
#   - upload-pages-artifact@v5 still defaults path to "_site/"
#   - setup-node@v7 still takes node-version
#
# Two behavior changes that DON'T bite here, worth knowing if that ever changes:
#   - setup-node v5+ auto-enables package-manager caching when package.json has
#     a `packageManager` field. This repo has no package.json at all, so it
#     cannot engage. If one is ever added, set `package-manager-cache: false`
#     or make sure a lockfile exists.
#   - upload-pages-artifact v5 defaults include-hidden-files to false. Nothing
#     shipped is hidden — the only dotfiles in a local _site are .DS_Store,
#     which are untracked and so never exist in a CI checkout.
#
# checkout v7 also blocks checking out fork PRs for pull_request_target and
# workflow_run. This workflow triggers on push, schedule and dispatch only.
#
# ruby/setup-ruby stays on the floating @v1 — it is not in the deprecation and
# tracks its own majors.

name: Deploy Jekyll via Push and Schedule

on:
  # schedule a deploy every day
  schedule:
    - cron: '1 0 * * *'
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
          
      # Node 22 LTS. Was pinned to 18, which left security support in Apr 2025.
      # Node only runs two things here — the agent-markdown script and Pagefind
      # — so nothing was broken by the old pin; it was simply an unsupported
      # runtime sitting in the deploy path. 22 is what the site is developed
      # against locally. Ruby above is on 3.3.5 and is current.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Generate agent Markdown (.md twins + llms.txt)
        run: node scripts/build-agent-markdown.mjs

      # Minify the scripts IN PLACE, so no HTML reference changes.
      #
      # That is the whole design. The site loads /assets/scripts/<name>.js
      # everywhere, and this step only makes those files smaller in _site.
      # Local `jekyll serve` and the Cloudflare Pages backup — whose build
      # command is set dashboard-side and does not include this step — both
      # keep serving the readable originals and work exactly as before.
      # Pointing the layout at bundle files that only CI produces would have
      # left both of those with no JavaScript at all.
      #
      # NOT concatenated, deliberately. sidenotes.js is posts-only, so one
      # bundle would put well over twice what a homepage needs onto it.
      # (pagefind-custom.js was the other example here until 2026-08-09, when
      # /search/ moved onto search.js and it was deleted.) Per-page-type bundles would
      # work but need the reference changes this step exists to avoid, and
      # under HTTP/2 the request count is not what costs. See _docs/javascript.md.
      #
      # 46.1 KB -> 15.2 KB raw, 15.9 KB -> 5.2 KB gzipped (measured 2026-08-09).
      # The gzipped figures FELL from 6.6 KB while the raw total rose: deleting
      # pagefind-custom.js and pagefind-autofocus.js took 4.8 KB of code, and
      # the raw growth is comment prose in search.js, which minifies to nothing.
      - name: Minify JavaScript
        run: npx --yes esbuild _site/assets/scripts/*.js --minify --outdir=_site/assets/scripts --allow-overwrite

      # Content-hash the long-cached assets and rewrite every reference, in two
      # passes: fonts first, then the font URLs inside the built stylesheets,
      # and only then the CSS and JS — so a stylesheet's hash covers its own
      # font URLs. One pass would hash CSS content that was about to change.
      #
      # MUST run after the minify step above, or the hash names bytes we do
      # not ship, and a rebuild that minifies differently would not bust.
      # (Visible proof: the CSS and font hashes match a local build exactly,
      # while the JS hashes differ — because only CI minifies.)
      #
      # Needed because /assets/* comes back `cache-control: max-age=31536000`
      # — a year, no revalidation. Without a new filename a returning reader
      # keeps the CSS and JS they already have no matter what we deploy. That
      # was already true of the scripts; externalising the CSS on 2026-07-27
      # made it load-bearing.
      #
      # Unlike the minify step this DOES change HTML references — but it
      # changes the files and the references together, so any build that skips
      # it (local `jekyll serve`, the Cloudflare Pages backup) is internally
      # consistent on the unhashed paths and works unchanged. The backup just
      # keeps the year-long staleness this fixes here.
      - name: Content-hash assets and rewrite references
        run: node scripts/hash-assets.mjs

      - name: Install Pagefind
        run: npm install pagefind
        
      - name: Build Pagefind index
        run: npx pagefind --site _site
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
