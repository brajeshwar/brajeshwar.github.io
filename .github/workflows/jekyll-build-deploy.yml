# Jekyll - Build and Deploy to Github Pages
# Pagefind, https://pagefind.app, powers the Search
# Updated: Aug 30, 2025

name: Deploy Jekyll via Push and Schedule

on:
  # schedule a deploy every day
  schedule:
    - cron: '1 0 * * *'
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
          
      # Node 22 LTS. Was pinned to 18, which left security support in Apr 2025.
      # Node only runs two things here — the agent-markdown script and Pagefind
      # — so nothing was broken by the old pin; it was simply an unsupported
      # runtime sitting in the deploy path. 22 is what the site is developed
      # against locally. Ruby above is on 3.3.5 and is current.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Generate agent Markdown (.md twins + llms.txt)
        run: node scripts/build-agent-markdown.mjs

      # Minify the scripts IN PLACE, so no HTML reference changes.
      #
      # That is the whole design. The site loads /assets/scripts/<name>.js
      # everywhere, and this step only makes those files smaller in _site.
      # Local `jekyll serve` and the Cloudflare Pages backup — whose build
      # command is set dashboard-side and does not include this step — both
      # keep serving the readable originals and work exactly as before.
      # Pointing the layout at bundle files that only CI produces would have
      # left both of those with no JavaScript at all.
      #
      # NOT concatenated, deliberately. sidenotes.js is posts-only and
      # pagefind-custom.js is /search/-only, so one bundle would put ~15 KB on
      # a homepage that needs about 7 KB of it. Per-page-type bundles would
      # work but need the reference changes this step exists to avoid, and
      # under HTTP/2 the request count is not what costs. See _docs/javascript.md.
      #
      # 36.7 KB -> 15.2 KB raw, 13.9 KB -> 6.6 KB gzipped.
      - name: Minify JavaScript
        run: npx --yes esbuild _site/assets/scripts/*.js --minify --outdir=_site/assets/scripts --allow-overwrite

      - name: Install Pagefind
        run: npm install pagefind
        
      - name: Build Pagefind index
        run: npx pagefind --site _site
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
