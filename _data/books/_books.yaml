# ===========================================================================
# THE BOOKS SHELF — read this file first; the others are data only.
#
# Brajeshwar, 2026-08-07: "I think the YAML files are easy to understand for me
# to add more data, I suggest removing all of the comments on the books YAML…
# Or leave the comment in just one of them, say _books.yaml to read and
# understand and for the AI to remember."
#
# ---------------------------------------------------------------------------
# WHAT IS IN THIS DIRECTORY
#
#   _books.yaml       THIS FILE. Personal Favorites — the grid at the top of
#                     /books/. Being in this file IS the flag; there is no
#                     `highlight` key any more.
#   01.yaml           titles starting with a number or a symbol.
#   a.yaml … z.yaml   one file per initial letter. There is no x.yaml, and an
#                     absent file simply emits no section.
#
# ---------------------------------------------------------------------------
# THE ONE RULE THAT IS EASY TO GET WRONG
#
# A BOOK IS FILED BY THE FIRST LETTER THAT IS NOT AN ARTICLE.
# "The Children" goes in c.yaml, not t.yaml. The rule covers The, A and An —
# so "A Room of One's Own" is in r.yaml, and "The 5 Elements of Effective
# Thinking" is in 01.yaml.
#
# /books/ takes its section headings from the FILENAME, never from the titles.
# There is no sorting code to consult and no second place to fix: put a book in
# the wrong file and it gets the wrong heading. 58 of the 167 books moved when
# this rule came in, so most of the shelf depends on it.
#
# A BOOK LIVES HERE OR IN A LETTER FILE, NEVER BOTH. The two grids read
# different files, so a duplicate renders twice and nothing catches it. The old
# `highlight: true` flag with a `where_exp` made that impossible; this does not.
#
# ---------------------------------------------------------------------------
# ADDING A BOOK
#
# Drop it in the right file. Entries are alphabetical within a file by that
# same article-stripped title, but appending to the end is fine — the book just
# shows last inside its own letter until someone moves it. Nothing derives
# meaning from position any more.
#
# FIELDS: title (required), author, url, img, alt.
#   img   a bare filename resolves under /static/books/. Leaving it out is
#         fine and renders a CSS bookplate rather than a broken image.
#
# ---------------------------------------------------------------------------
# THREE THINGS THAT BREAK QUIETLY, FOR WHOEVER EDITS THE TEMPLATES
#
# `site.data.books` is a HASH keyed by filename, not an array. `slice`, `where`
# and `where_exp` all stop working on it — and `slice` fails SILENTLY: the home
# page strip rendered one item instead of seven with the build still green.
# Count the items; do not trust the exit code.
#
# `_books` IS a key in that hash, sorting between `01` and `a` — Jekyll reads
# underscore-prefixed data files quite happily. _pages/books.html skips it by
# name in the A–Z loop, or the page grows a "_BOOKS" section.
#
# The home strip on / shows THESE FOUR, not the newest. An A–Z split scatters
# chronology across 27 files and nothing in the data records when a book
# arrived. See the note in index.html.
# ===========================================================================

