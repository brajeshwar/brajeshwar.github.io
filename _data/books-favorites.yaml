# ===========================================================================
# Personal Favorites — the grid at the top of /books/.
#
# Moved OUT of _data/books/ on 2026-08-08. It lived there as `_books.yaml` for
# a few hours, on the idea that an underscore would sort it to the top of the
# folder for easy editing. Brajeshwar: "looks like it makes no sense. I won't
# be editing it often enough and is no longer at the top."
#
# Being in this file IS the flag; there is no `highlight` key.
#
# ⚠️ A BOOK LIVES HERE OR IN _data/books/, NEVER BOTH. The two grids on /books/
# read different files, so a duplicate renders twice and nothing catches it.
#
# FIELDS: title (required), author, url, img, alt.
#
# The full explanation of the shelf — how books are filed by letter, why "The
# Children" is in c.yaml, and what breaks quietly in the templates — is in
# _data/books/a.yaml's neighbours no longer; it now lives in _pages/books.html
# and _pages/styleguide.md.
# ===========================================================================

