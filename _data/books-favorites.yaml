# ===========================================================================
# Personal Favorites — the grid at the top of /books/.
#
# Split out of the `highlight: true` flag on 2026-08-07 (Brajeshwar: "you can
# remove the highlight as my favorites into a separate YAML"). Being in this
# file IS the flag; there is no key to set.
#
# ⚠️ A BOOK LIVES HERE OR IN _data/books/, NEVER BOTH. The two grids on /books/
# read different files, so a duplicate would render twice with nothing to catch
# it — the old `where_exp` that guaranteed they were disjoint is gone.
#
# Same fields as the letter files: title (required), author, url, img, alt.
# ===========================================================================

- title: The Design of Everyday Things
  author: Don Norman
  url: /2013/the-design-of-everyday-things/
  img: the-design-of-everyday-things.webp
  alt: A clean set of everyday objects

- title: Genghis Khan and the Making of the Modern World
  author: Jack Weatherford
  url: /2019/genghis-khan-and-the-making-of-the-modern-world/
  img: genghis-khan.webp
  alt: Genghis Khan on a Horse

- title: The Lord of the Rings
  author: J.R.R. Tolkien
  url: /2022/the-lord-of-the-rings/
  img: the-lord-of-the-rings.webp
  alt: The One Ring to Rule Them All

- title: 1984
  author: George Orwell
  url: /2024/1984/
  img: 1984.webp
  alt: The Manuscript of the book 1984
