# ===========================================================================
# ⚠️ NEWEST FIRST. THE TOP OF THIS FILE IS THE TOP OF THE SHELF.
#
# Brajeshwar 2026-08-04: "The last one should be the first in the books.yaml
# as I will add at the top and not at the bottom." So a new book goes ABOVE
# this line's first entry, and nothing else has to be touched.
#
# ⚠️ THIS REVERSES THE OLD PROTOCOL, which was the opposite and is quoted in
# index.html for the record (2026-08-01: "the latest is always the last entry
# in the YAML file"). Both the home strip and /books/ now render this file in
# ITS OWN ORDER — index.html dropped the `reverse` filter it used to apply,
# and /books/ never had one. That is the whole point: what you see is the
# order you typed, on both pages, so there is no longer a mental flip between
# editing this file and reading the site.
#
# HIGHLIGHTS ARE A SEPARATE SECTION AND ARE NOT REPEATED BELOW IT.
# `highlight: true` moves a book into the "Personal Favorites" grid at the top
# of /books/, and _pages/books.html builds the second grid from
# `highlight != true`, so the two are disjoint by construction. Promoting a
# book is one word in one place; it does not move in this file.
#
# THE YEAR MARKERS ARE COMMENTS, NOT STRUCTURE. Nothing reads them — this is
# a flat array and the order is the only thing that carries meaning. They are
# here because 176 entries in one list is hard to navigate by eye.
#
# NO `img` ON MOST OF THESE, ON PURPOSE. An entry without one renders a
# .bookplate — the bound board drawn in CSS, _sass/bookplate.scss — so a book
# can be listed the day it is read and the cover picture can arrive later, or
# never. Adding an `img` later turns the plate into a cover with no other edit.
# ===========================================================================

