# ---------------------------------------------------------------------------
# From /2026/books/, added 2026-08-04.
#
# NO `img` ON ANY OF THESE, ON PURPOSE. An entry without one renders a
# .bookplate — the bound board drawn in CSS (_sass/bookplate.scss) — so a book
# can be listed the day it is read and the cover picture can arrive later, or
# never. Adding an `img` later turns the plate into a cover with no other edit.
#
# In the post's own order, which is alphabetical by section. That matters
# because LAST IN THIS FILE IS NEWEST: the home shelf takes the last eight and
# reverses them, so The Three-Body Problem leads the row — which is right, it
# is the one being read now.
#
# `url` points at /2026/books/ for all but one, because that is where each is
# actually written about; there are no per-book posts for these. How to Read a
# Book has its own review, so it points there instead. The Design of Everyday
# Things is in that post too and is NOT repeated here — it is already above,
# with its cover and its highlight.
# ---------------------------------------------------------------------------

