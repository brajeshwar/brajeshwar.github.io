# ===========================================================================
# From the yearly /YYYY/books/ posts, 2018-2025. Extracted 2026-08-04:
# "Extract from 2018, all the way till 2025. I will edit after that."
#
# NO `img` EXCEPT WHERE A THUMBNAIL ALREADY EXISTED, so these render as
# bookplates (_sass/bookplate.scss) and covers can be cut later, or never.
#
# ORDER IS CHRONOLOGICAL, oldest first, and it sits BEFORE the 2026 block at
# the foot of this file. That is not cosmetic: the home page takes the LAST
# entries and reverses them, so the file's order is the site's idea of "newest"
# (index.html: "the latest is always the last entry in the YAML file").
#
# `url` is the year's own post for each, because that is where the book is
# written about. Four have a dedicated post and point there instead.
#
# A BOOK APPEARS ONCE, in the year it was FIRST written about. He re-reads a
# lot, so several are discussed in two or three years — Ego Is the Enemy in
# 2018/2019/2021, Atomic Habits in 2019/2022, How to Win Friends in 2018/2020,
# Venture Deals and The Future Is Asian in 2019/2020, Start With Why and The
# Infinite Game in 2019/2020, Stillness Is the Key in 2019/2021, Bringing Up
# Bébé and Reviving Ophelia in 2019/2021/2022, Essentialism and Effortless in
# 2022/2024, How We Got to Now in 2022/2024, The Future We Choose in 2022/2023,
# The Odyssey in 2024/2025. Listing each again is what the yearly posts do and
# would be wrong here, where this is one shelf and not a log.
#
# ALREADY ABOVE AND NOT REPEATED: 1984, The Lord of the Rings, Leonardo da
# Vinci, The Design of Everyday Things, Genghis Khan and the Making of the
# Modern World, The Story of My Experiments with Truth. All six are discussed
# in these posts and all six already have covers and, mostly, `highlight`.
# ===========================================================================

