# ===========================================================================
# The books shelf. Rendered by _pages/books.html and the home page strip.
#
# ⚠️ THE ORDER OF THIS FILE IS THE ORDER OF THE SITE. Neither page sorts or
# reverses: index.html takes a plain slice off the HEAD for the home strip,
# and /books/ renders the whole thing as written. So the top of this file is
# the top of the shelf and the left of the home row — add a new book ABOVE the
# first entry, not at the bottom (2026-08-04: "The last one should be the
# first in the books.yaml as I will add at the top and not at the bottom").
# ⚠️ _data/album.yaml is the OPPOSITE, still newest-last, and index.html still
# reverses that one. The two conventions differ on purpose; do not unify them
# without changing both sides.
#
# ⚠️ THE CURRENT ORDER IS SHUFFLED, NOT CHRONOLOGICAL — that is deliberate and
# is not damage to repair (2026-08-04: "do a random sweep of the list - make
# the items random before I do my manual edit"). It was a seeded shuffle of
# the newest-first list, so the previous order is recoverable exactly: see the
# commit before it in `git log -- _data/books.yaml`. Each book still records
# its own year in `url`, so nothing was lost with the year separators that
# used to break this file into blocks.
#
# HIGHLIGHTS ARE A SEPARATE SECTION AND ARE NEVER REPEATED BELOW IT.
# `highlight: true` moves a book into the "Personal Favorites" grid at the top
# of /books/; _pages/books.html builds the second grid from `highlight != true`
# so the two are disjoint by construction. Promoting a book is one word in one
# place and does not move it in this file.
#
# NO `img` ON MOST OF THESE, ON PURPOSE. An entry without one renders a
# .bookplate — the bound board drawn in CSS, _sass/bookplate.scss — so a book
# can be listed the day it is read and the cover picture can arrive later, or
# never. Adding an `img` later turns the plate into a cover with no other edit.
# Bare filenames resolve under /static/books/; a value starting with `/` is
# used verbatim.
#
# FIELDS: title (required), author, url (required), img, alt, highlight.
# ===========================================================================

