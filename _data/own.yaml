# ===========================================================================
# /own/ — the things owned, worn and carried.
#
# Renamed from /wear/ on 2026-08-07. "Wear" named only the first of three
# groups; "Own" is the honest superset and does not break the first time a
# laptop or a bicycle joins the list. The third group was called Own and is now
# KEEP, which frees the word for the page itself.
#
# ⚠️ EVERY ITEM BELOW IS A PLACEHOLDER. Not one of them is a claim about what
# Brajeshwar actually owns — they are there so the layout has something to
# stand up, and they are all meant to be overwritten or deleted. Nothing links
# to this page yet (2026-08-07: "Do not need to link the page yet").
#
# SHAPE
#   sections  the top-level split. This exists because the Own-vs-Wear
#             question is open (2026-08-07: "I'm still un-decided on if I
#             consider this an 'Own' or 'Wear'"). Both live on one page for
#             now, so the decision can be made by looking at it rather than in
#             the abstract — and if it later splits into two pages, a section
#             lifts out whole. Settled 2026-08-07: the page is Own, the groups
#             are Wear / Carry / Keep.
#   rows      one line of the inventory: Shirts, Bags, Devices. A row scrolls
#             sideways on its own when it outgrows the column, so a long line
#             is a feature and not a problem to solve.
#   items     brand + name, plus:
#               note  optional — colour, count, whatever the line needs
#               img   optional — a logo or a picture, bare filename resolving
#                     under /static/own/, rendered as a plain <img> IN ITS OWN
#                     COLOURS (2026-08-07: "it is OK to keep their original
#                     branding color and logo. Just like how we have colorful
#                     photos"). No img renders a typeset mark carrying the
#                     brand's initial, the same idea as the bookplate on
#                     /books/: a designed stand-in, never a hole.
#               url   optional — makes the whole item a link
#
# FIELDS: brand (required), name, note, img, url.
# ===========================================================================

- section: Wear
