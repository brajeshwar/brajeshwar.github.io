      # ⚠️ /devices/ is the SAME OBJECTS IN A DIFFERENT TENSE — the lineage
      # since 1999, dead hardware included. This row is what is in the house
      # today. Two pages, one link, no duplication.
      link: /devices/
      link_text: the lineage since 1999
      items:
        - brand: Placeholder
          name: Laptop
          note: renew 2028
        - brand: Placeholder
          name: Phone
          note: renew 2027

    - label: Desk
