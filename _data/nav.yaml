main:
- title: About
  url: "/about/"
- title: Archives
  url: "/archives/"
- title: Now
  url: "/now/"
- title: Contact
  url: "/contact/"

# footer: centered page links, rendered as one row with a subtle bullet between each group.
footer:
- links:
  - title: Home
    url: "/"
- links:
  - title: About
    url: "/about/"
  # ⚠️ THE ONE OFF-SITE ENTRY IN THIS NAV (2026-09-01). The album is not hosted
  # here any more — brajeshwar.com/album/ is a redirect stub, and this points
  # past it at the real thing. footer.html tests for "http" and gives it a new
  # tab, rel="noopener" and the ↗ mark; nothing else in `footer` needs that.
  #
  # ⚠️ `target` IS A WINDOW NAME, NOT `_blank`, AND THE STRING IS SHARED. The
  # home page's album strip opens into `_oinam-albums` too (index.html), so
  # every link to the album on this site lands in ONE tab and reuses it rather
  # than opening a new one per click. Change it here and you must change it
  # there; nothing checks that the two agree.
  - title: Albums
    url: "https://albums.oinam.com"
    target: "_oinam-albums"
  - title: Archives
    url: "/archives/"
  - title: Books
    url: "/books/"
  - title: Film
    url: "/film/"
- links:
  - title: Legal
    url: "/legal/"
  - title: Newsletter
    url: "/newsletter/"
  - title: Now
    url: "/now/"
  - title: Search
    url: "/search/"
- links:
  - title: Contact
    url: "/contact/"

# social: icon links below the page links. icon = _includes/icons/<icon>.svg (inline SVG).
social:
- title: RSS
  url: "/feed.xml"
  icon: rss
- title: Twitter
  url: "https://twitter.com/brajeshwar"
  icon: twitter
- title: Github
  url: "https://github.com/brajeshwar"
  icon: github
- title: Mastodon
  url: "https://margins.oinam.com/@brajeshwar"
  icon: mastodon
  rel: me
- title: Memos
  url: "https://bits.oinam.com/"
  icon: memos
- title: Instagram
  url: "https://www.instagram.com/oinam/"
  icon: instagram
