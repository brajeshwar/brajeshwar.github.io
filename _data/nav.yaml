# footer: centered page links, rendered as one row with a subtle bullet between each group.
footer:
- links:
  - title: Home
    url: "/"
- links:
  - title: About
    url: "/about/"
  # ⚠️ THE ONE OFF-SITE ENTRY IN THIS NAV (2026-09-01). The album is not hosted
  # here any more — brajeshwar.com/album/ is a redirect stub, and this points
  # past it at the real thing. footer.html tests for "http" and gives it the ↗
  # mark and an "(external link)" label; nothing else in `footer` needs either.
  #
  # ⚠️ IT DOES NOT FORCE A NEW TAB. It carried `target: "_blank"` and, before
  # that, a shared `_oinam` window name — both gone: "I don't want to break
  # convention and force a target=_blank." There is no `target:` key here any
  # more, and footer.html emits none. The full history is in home-strip.html.
  - title: Albums
    url: "https://albums.oinam.com"
  - title: Archives
    url: "/archives/"
  - title: Books
    url: "/books/"
  - title: Film
    url: "/film/"
- links:
  - title: Legal
    url: "/legal/"
  - title: Newsletter
    url: "/newsletter/"
  - title: Now
    url: "/now/"
  - title: Search
    url: "/search/"
- links:
  - title: Contact
    url: "/contact/"

