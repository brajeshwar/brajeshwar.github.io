# Album — feeds the /album/ page and the Album strip on the home page.
#
# Real data since 2026-08-01. This file used to hold twelve placeholders that
# borrowed thumbnails from /static/books/, because /static/album/ did not exist
# yet; the first real photo replaced all of them. Nothing here is a stand-in
# any more, so anything that looks wrong on the page is a real bug.
#
# ---------------------------------------------------------------------------
# ADDING A PHOTO — the whole protocol
# ---------------------------------------------------------------------------
# 1. Drop the master in `_src/album/<slug>.<ext>`. It goes to Git LFS by path
#    and never ships, because `_src` starts with an underscore. Use `git add`,
#    never `git mv` — see /styleguide/ § Keep the master for why that matters.
# 2. Cut `static/album/<slug>.webp` from it, same stem, NATIVE aspect ratio.
#    Do not pre-crop to 4:3: /album/ is masonry and shows the real shape, and
#    the home strip crops to 4:3 itself with `object-fit: cover`.
# 3. Append an entry below. THE LAST ENTRY IS THE NEWEST — that is the entire
#    ordering protocol, same as _data/books.yaml, and it is why the home strip
#    reads newest-first while /album/ keeps this file's own order. There is
#    deliberately no date field.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
# THREE FIELDS, and that is the whole shape. Deliberately so — see below.
#
# title  Two jobs. It is the caption on the home strip, and it is ALSO the
#        image's alt text: the includes emit `item.alt | default: item.title`,
#        so with no `alt` written here the title is what a screen reader reads.
#        Brajeshwar 2026-08-01: "remove the alt too, the title should be the
#        alt in the html." Write titles that stand up to being read aloud with
#        the picture unseen — they are doing both jobs.
# img    BARE filename — resolves under /static/album/ automatically. A leading
#        "/" is the escape hatch for pointing somewhere else entirely.
# url    Where the card links. Brajeshwar 2026-08-01: "I'm going to have custom
#        URLs for each." Anything starting with "http" is emitted verbatim with
#        rel="noopener"; anything else goes through relative_url. So absolute
#        URLs belong here as written and must NOT be run through relative_url.
#
# media  OPTIONAL — "video" or "audio" puts a small icon badge over the corner
#        of the frame. Omit it for a still photograph, which is the default.
#        (The section was renamed from Photos on 2026-08-01 precisely because
#        it will carry video and audio too.)
#
# ⚠️ NO `w`/`h`, DELIBERATELY, AND THIS HAS BEEN DECIDED TWICE.
# They are the cut file's real pixel size, and adding them would tell the
# browser each photo's SHAPE before its bytes arrive. Removed the first time on
# the reasoning that they pin a layout meant to be ragged — which was the wrong
# model, they pin nothing. Added back to fix Safari. Removed again, knowing
# exactly what that costs: "I'd rather live with a non-aligned masonry than
# introduce size in the album.yaml."
#
# WHAT IT COSTS, so nobody rediscovers it as a bug: with no dimensions, nothing
# reserves space before an image loads. Every card is about 16px tall at first
# layout and the masonry columns are balanced against those heights. Chrome
# re-balances when the images land and looks perfect. Safari does not fully
# redo the packing, so /album/'s first row sits unevenly there. That is a known
# and accepted trade, not a defect to fix — the fix is these two numbers per
# photo, and the two numbers are the thing being refused.
#
# ⚠️ AND IT IS HALF A FIX EITHER WAY. page.scss declares `aspect-ratio: auto`
# on masonry images, which cancels the rule that reads width/height attributes.
# Adding w/h here without removing that declaration does NOTHING; removing that
# declaration without adding w/h here is WORSE than both, because every card
# then reserves the wrong 3:4 default and visibly jumps on load. Both or
# neither. Measured in Chrome, 244.8px container, image never loading:
#
#   w/h 600x464, no aspect-ratio declared  -> 189.3px reserved (correct)
#   w/h 225x300, no aspect-ratio declared  -> 326.4px reserved (wrong shape)
#   w/h 600x464, aspect-ratio: auto        ->  16px (nothing reserved)
#   no attributes at all                   ->  16px

# ⚠️ `url` IS OPTIONAL. An entry without one renders as a plain unlinked
# figure — not as an empty anchor, which would be a link back to this page.
# So a photo can go up the moment it is cut and become a link whenever its
# destination exists. Add the line, nothing else changes.
#
# FILENAMES ARE DATED — `YYYY-MM-DD-slug` — and the published .webp keeps the
# same stem as its master in _src/album/. The date is when the photo was taken,
# which is not the order this file is read in: ordering is position, last entry
# newest, exactly as with books. They agree today and are allowed to diverge;
# if you add an old photograph, decide whether it belongs at the end (newest
# ADDED) or in date order, and stay consistent.

