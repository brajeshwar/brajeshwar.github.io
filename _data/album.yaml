# PLACEHOLDER DATA — created 2026-07-31, renamed photos.yaml → album.yaml on
# 2026-08-01 because the section will carry video and audio too, not only
# photographs. Feeds the Album strip on the home page and the /album/ page:
#
#   "What happened to the new 'Photos' section. Copy 'Books' but the thumbnails
#    are 4:3. If there are nothing, copy from the books or or something for the
#    thumbnail. I will populate it later."
#
# ⚠️ EVERY IMAGE HERE IS BORROWED FROM /static/books/. There is no
# /static/album/ directory yet, and a broken <img> would read as a bug rather
# than as a placeholder. The strip renders them at 4:3, so these 3:4 book
# covers are center-cropped by `object-fit: cover` — they will look like
# cropped book covers, because that is exactly what they are.
#
# TO REPLACE: drop real files into /static/album/, then rewrite this file with
# the same four fields and BARE filenames (no leading "/"), which resolve under
# /static/album/ automatically. The leading slash below is the escape hatch
# that lets a placeholder point somewhere else; real entries do not need it.
#
# Same shape as _data/books.yaml: title, url, img, alt.
#
# `url` points OFF-SITE, to the photo's page on album.oinam.com (2026-08-01:
# "each will link to an external source, mostly like
# https://album.oinam.com/album/somephoto/"). The card-grid include emits any
# url starting with "http" verbatim with rel="noopener", so absolute URLs are
# expected here and must NOT be run through relative_url.
#
# `media:` is OPTIONAL and marks what the thumbnail actually leads to —
# "video" or "audio" put a small icon badge over the corner of the frame. Omit
# it for a still photograph, which is the default and needs no marker.
#
# ⚠️ `alt` is now the ONLY description these images carry — /album/ prints no
# captions, so a screen reader has nothing else to go on and `title` is used
# only as the alt fallback. Write real alt text for the real photos; the
# placeholder text below is not a template worth copying.

