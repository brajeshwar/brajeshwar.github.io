title: 'Brajeshwar'
description: 'I’m on an adventure to create beautiful, meaningful products that improve the world for my daughters and their friends.'

url: 'https://brajeshwar.com'
baseurl: ''

markdown: kramdown

# Syntax highlighting is OFF (2026-07-27). Code blocks render as plain
# <pre><code class="language-x"> with no Rouge <span> soup and no .highlight
# wrapper — base.css already gives <pre> its block, monospace and scroll.
#
# Why: only 55 of 1,456 posts have a code block, 257 of their 310 blocks are
# plaintext (nothing to color), and Brajeshwar does not plan to write
# code-heavy posts. Measured saving on those 55 posts: 261,791 bytes, 8.8%
# of their HTML — the span markup plus the code.css bundle, which is keyed
# off .highlight and so now never loads.
#
# It is also the only place color appeared by default on a monotone site.
#
# To bring it back, three steps:
#   1. delete the `kramdown:` block below;
#   2. restore the stylesheet — `git show 22cb3522:_includes/css/code.css`;
#   3. re-add the conditional include to _includes/styles-posts.html:
#      {% if content contains 'class="highlight"' %}...{% endif %}
#      (inline in the `if` — Liquid's `assign` does not evaluate `contains`).
kramdown:
  syntax_highlighter_opts:
    disable: true

# Enable line-numbers for code (TBD: Table layout seems to have a conflict with this)
# kramdown:
#   syntax_highlighter_opts:
#     block:
#       line_numbers: true

theme: null
permalink: pretty
permalink: /:title/

feed:
  posts_limit: 9
  author: Brajeshwar

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-titles-from-headings
  
optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

defaults:
  - scope:
      path: '_posts'
      type: 'posts'
    values:
      layout: 'post'
      permalink: '/:year/:title/'
  - scope:
      path: '_redirect'
      type: 'pages'
    values:
      layout: 'redirect'
  - scope:
      path: '_pages'
      type: 'pages'
    values:
      layout: 'page'
      permalink: '/:name/'
      # No excerpts for pages. Jekyll builds one for every document by cutting
      # at the first "\n\n"; when that cut lands inside a Liquid block it
      # rewrites the block to close it and warns:
      #
      #   Warning: Excerpt modified in _pages/archives.html!
      #   Found a Liquid block containing the excerpt separator "\n\n".
      #
      # archives.html opens with a multi-paragraph {%- comment -%} explaining
      # the group_by_exp, so the cut fell inside it. Setting the separator to
      # "" makes Jekyll skip excerpt generation entirely for the collection
      # (Document#generate_excerpt? is `!excerpt_separator.empty?`).
      #
      # Set here rather than on the one file because it is a property of the
      # collection, not of that page: any page whose first blank line falls
      # inside a Liquid block would warn the same way, and this repo comments
      # its templates heavily. Safe because NOTHING reads `.excerpt` — no
      # layout, include, script or config — and jekyll-feed, the only plugin
      # that would, feeds posts only. Posts keep their excerpts.
      excerpt_separator: ''

collections:
  redirect:
    output: true
  pages:
    output: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules        # defining `exclude` drops Jekyll's defaults — re-add the important ones
  - vendor
  - now/
  - README.md
  - CLAUDE.md           # agent guidance — must not be published (/CLAUDE/)
  - Makefile            # dev tooling
  - scripts             # post-build scripts run from the checkout, not the published site
  # The variable TTF is the SOURCE we re-subset from, not a shipped asset. Only
  # Geist-Variable.woff2 is referenced by themes.css, and the ttf is 169 KB
  # against its 47 KB — three and a half times the file it replaced, sitting in
  # the deploy for nobody. Kept in the repo so the subset can be regenerated
  # (the pyftsubset command is in themes.css); excluded from the build.
  - assets/fonts/geist/Geist-Variable.ttf
  # Same deal for Source Serif 4 (2026-08-02): the two TTFs are the full
  # upstream variable sources (2 MB, all axes) kept only for re-subsetting —
  # the recipe is in themes.css. LICENSE.md is excluded for a different
  # reason: jekyll-optional-front-matter turns any bare .md into a PAGE, so
  # unexcluded it would publish as rendered HTML at its own URL. The license
  # stays readable in the public repo, which is where the sources live.
  - assets/fonts/source-serif/SourceSerif4Variable-Roman.ttf
  - assets/fonts/source-serif/SourceSerif4Variable-Italic.ttf
  - assets/fonts/source-serif/LICENSE.md
  # NOTE: agents-manifest.json is intentionally NOT excluded — Jekyll must render it so
  # scripts/build-agent-markdown.mjs can read it; the script deletes it before deploy.
