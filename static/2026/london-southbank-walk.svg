<svg xmlns="http://www.w3.org/2000/svg" viewBox="-521 -307 911 608" role="img" aria-label="An isometric map of the walk along the South Bank, from Waterloo Station to Shad Thames, with fifteen numbered stops">
<style>
:root { --paper:#fafafa;--ink:#1a1a1a;--ink-2:#555;--muted:#777;--river:#dadada;--bank:#c4c4c4;--bridge:#9a9a9a;--top:#f4f4f4;--side-a:#c2c2c2;--side-b:#a2a2a2;--edge:#555;--hi:#000; }
@media (prefers-color-scheme: dark) { :root { --paper:#161616;--ink:#e8e8e8;--ink-2:#aaa;--muted:#8a8a8a;--river:#2c2c2c;--bank:#3a3a3a;--bridge:#5a5a5a;--top:#3a3a3a;--side-a:#2a2a2a;--side-b:#222;--edge:#8a8a8a;--hi:#fff; } }

.river { fill: var(--river); }
.bank { fill: none; stroke: var(--bank); stroke-width: 1; }
.bridge { fill: none; stroke: var(--bridge); stroke-width: 3; stroke-linecap: round; }
.bridge--stop { stroke: var(--ink-2); stroke-width: 4; }
.walk { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
.top { fill: var(--top); stroke: var(--edge); stroke-width: .7; }
.side-a { fill: var(--side-a); stroke: var(--edge); stroke-width: .7; }
.side-b { fill: var(--side-b); stroke: var(--edge); stroke-width: .7; }
.stop circle { fill: var(--ink); }
.stop__n { fill: var(--paper); font: 600 7px system-ui, sans-serif; text-anchor: middle; }
.north line { stroke: var(--ink-2); stroke-width: 1.5; }
.north text, .river-name { font: italic 12px system-ui, sans-serif; fill: var(--muted); }
</style>
